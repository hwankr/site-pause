<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>잠깐, 집중</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="popup.js"></script>
</head>
<body class="popup-page">
  <main class="popup-shell">
    <header class="brand-row">
      <span class="brand"><span class="brand-mark" aria-hidden="true">Ⅱ</span>잠깐, 집중</span>
      <span class="eyebrow">ONE THING AT A TIME</span>
    </header>

    <section class="focus-hero" aria-labelledby="hero-title">
      <div class="status-pill" id="status-pill"><span class="status-dot"></span><span id="status-label">상태 확인 중</span></div>
      <h1 id="hero-title">지금은,<br>한 문제에 집중.</h1>
      <p class="hero-description" id="hero-description">차단 상태를 불러오고 있어요.</p>
      <div class="hero-art" aria-hidden="true"><span class="art-line"></span><span class="art-circle"></span><span class="art-pause">Ⅱ</span></div>
    </section>

    <button id="toggle-button" class="primary-button toggle-button" type="button" role="switch" aria-checked="false" disabled>
      <span id="toggle-label">잠시만 기다려 주세요</span><span class="switch-track" aria-hidden="true"><span></span></span>
    </button>
    <p class="activation-note" id="activation-note">켜면 열려 있는 해당 사이트도 차단 화면으로 바뀝니다.<br>작성 중인 내용은 먼저 저장해 주세요.</p>
    <p id="message" class="message" role="status" hidden></p>

    <section class="sites-summary" aria-labelledby="sites-title">
      <div class="section-row"><h2 id="sites-title">잠시 멀리할 사이트 <span id="site-count">—</span></h2><button class="text-button" id="settings-button" type="button">편집 <span aria-hidden="true">↗</span></button></div>
      <div class="site-chips" id="site-chips"></div>
      <p class="empty-hint" id="empty-hint" hidden>먼저 사이트를 골라 주세요.<br>나에게 방해되는 곳만 직접 추가할 수 있어요.</p>
    </section>
    <footer class="popup-footer"><span class="tiny-line" aria-hidden="true"></span>집중은 작게, 한 번에 하나씩.</footer>
  </main>
</body>
</html>
