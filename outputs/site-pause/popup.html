<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>잠깐, 집중</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="popup.js"></script>
</head>
<body class="popup-page">
  <main class="popup-shell">
    <header class="brand-row">
      <span class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i></span>잠깐, 집중</span>
      <button id="settings-button" class="icon-button" type="button" aria-label="사이트 관리">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      </button>
    </header>
    <section class="blocking-card" aria-labelledby="control-title">
      <div class="section-row">
        <h1 id="control-title">사이트 차단</h1>
        <span class="status-pill" id="status-label">불러오는 중</span>
      </div>
      <div class="blocking-value"><strong id="site-count">0</strong><span>개 사이트</span></div>
      <button id="toggle-button" class="primary-button toggle-button" type="button" role="switch" aria-label="사이트 차단" aria-checked="false" disabled>
        <span id="toggle-label">불러오는 중</span><span class="switch-track" aria-hidden="true"><span></span></span>
      </button>
    </section>
    <p id="message" class="message" role="status" hidden></p>
    <section class="sites-summary" aria-labelledby="sites-title">
      <div class="section-row">
        <h2 id="sites-title">차단 목록</h2>
        <button id="edit-button" class="text-button" type="button"><span id="edit-label">편집</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m6 4 4 4-4 4"/></svg></button>
      </div>
      <div id="site-list" class="site-list"></div>
      <p id="empty-hint" class="empty-state" hidden>등록된 사이트 없음</p>
      <button id="more-button" class="more-button" type="button" hidden></button>
    </section>
  </main>
</body>
</html>
