<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>잠깐, 지금은 집중할 시간이에요.</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="blocked.js"></script>
</head>
<body class="blocked-page">
  <header class="blocked-header"><span class="brand"><span class="brand-mark" aria-hidden="true">Ⅱ</span>잠깐, 집중</span><span class="eyebrow">ONE THING AT A TIME</span></header>
  <main class="blocked-main">
    <div class="pause-illustration" aria-hidden="true"><span class="orbit orbit-one"></span><span class="orbit orbit-two"></span><span class="pause-disk">Ⅱ</span><span class="orbit-dot"></span></div>
    <span class="status-pill"><span class="status-dot"></span><span id="blocked-status">상태 확인 중</span></span>
    <h1 id="blocked-heading">잠깐,<br>지금은 집중할 시간이에요.</h1>
    <p class="blocked-description" id="blocked-description">잠시 멈추고, 하던 공부로 돌아가 볼까요?</p>
    <span id="blocked-site" class="blocked-site" hidden></span>
    <a class="primary-button return-link" id="return-link" hidden>사이트 열기 <span aria-hidden="true">↗</span></a>
    <p class="blocked-help" id="blocked-help">차단을 끄려면 Chrome 도구 모음에서<br><strong>잠깐, 집중</strong> 아이콘을 눌러 주세요.</p>
    <p class="message" id="message" role="status" hidden></p>
  </main>
  <footer class="blocked-footer">지금 풀고 있는 한 문제에, 한 걸음 더.</footer>
</body>
</html>
