<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사이트 관리 — 잠깐, 집중</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="options.js"></script>
</head>
<body class="options-page">
  <div class="settings-shell">
    <header class="settings-header">
      <a class="brand" href="options.html"><span class="brand-mark" aria-hidden="true"><i></i><i></i></span>잠깐, 집중</a>
    </header>
    <main>
      <h1 class="page-title">사이트 관리</h1>
      <section class="control-card" aria-labelledby="control-title">
        <div class="section-row">
          <div class="control-copy"><h2 id="control-title">사이트 차단</h2><span id="toggle-label" class="control-status">불러오는 중</span></div>
          <button id="toggle-button" class="switch-button" type="button" role="switch" aria-label="사이트 차단" aria-checked="false" disabled>
            <span class="switch-track" aria-hidden="true"><span></span></span>
          </button>
        </div>
        <p id="toggle-message" class="message" role="status" hidden></p>
      </section>
      <section class="settings-card" aria-labelledby="list-title">
        <div class="section-row">
          <h2 id="list-title">차단 목록</h2>
          <span class="count-badge" id="saved-count" aria-label="차단 목록 불러오는 중">—</span>
        </div>
        <ul id="site-list" class="settings-list" aria-label="차단 사이트"></ul>
        <div id="empty-state" class="empty-state" hidden>등록된 사이트 없음</div>
        <form id="add-form" class="add-site-row">
          <input id="site-input" class="site-input" type="text" aria-label="추가할 사이트 주소" placeholder="example.com" spellcheck="false" autocapitalize="off" autocomplete="off" disabled>
          <button id="add-button" class="secondary-button" type="submit" disabled>추가</button>
        </form>
        <div class="quick-buttons" aria-label="빠른 추가">
          <button type="button" data-site="youtube.com" disabled>YouTube</button>
          <button type="button" data-site="instagram.com" disabled>Instagram</button>
          <button type="button" data-site="x.com" disabled>X</button>
          <button type="button" data-site="reddit.com" disabled>Reddit</button>
        </div>
        <div class="save-row">
          <span id="draft-status" class="draft-status" role="status" hidden>미저장</span>
          <button id="save-button" class="primary-button" type="button" disabled>저장</button>
        </div>
        <p id="save-message" class="message" role="status" hidden></p>
      </section>
    </main>
  </div>
</body>
</html>
